# Alembic configuration file for NaijaTax Bot.
# The sqlalchemy.url is overridden at runtime in bot/database/db.py
# via cfg.set_main_option("sqlalchemy.url", ...) before running migrations.

[alembic]
script_location = alembic
prepend_sys_path = .

# Default URL — overridden at runtime
sqlalchemy.url = sqlite:///naijatax_local.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
